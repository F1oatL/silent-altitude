    &lt;p&gt;从研究生新生读文献的真实痛点出发，结合竞品调研，完成需求分析与机会识别&lt;/p&gt;

    &lt;div class=&quot;persona-card&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;persona-avatar&quot;&gt;👩‍🎓&lt;/div&gt;

        &lt;h3&gt;小林 · 22岁&lt;/h3&gt;
        &lt;div class=&quot;role&quot;&gt;某 985 高校硕士新生 · 生物医学工程方向&lt;/div&gt;
        &lt;p class=&quot;bio&quot;&gt;
          刚保研入学，导师第一周就丢了 20 篇英文文献让她读并写综述。本科阶段英文阅读量有限，
          四六级飘过，面对满屏的专业术语和长难句，一篇 10 页的论文要啃 3 天。身边同学各有各的工具，
          但她不知道选哪个好，也不想在多个软件之间反复切换。
        &lt;/p&gt;
        &lt;div class=&quot;persona-tags&quot;&gt;
          &lt;span class=&quot;persona-tag&quot;&gt;科研小白&lt;/span&gt;
          &lt;span class=&quot;persona-tag&quot;&gt;英文阅读吃力&lt;/span&gt;
          &lt;span class=&quot;persona-tag&quot;&gt;时间紧任务重&lt;/span&gt;
          &lt;span class=&quot;persona-tag&quot;&gt;预算有限&lt;/span&gt;
          &lt;span class=&quot;persona-tag&quot;&gt;工具选择困难&lt;/span&gt;
        &lt;/div&gt;
        &lt;div style=&quot;display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;&quot;&gt;
          &lt;div style=&quot;background: #F0FDF4; padding: 12px; border-radius: 8px;&quot;&gt;
            &lt;div style=&quot;font-size: 13px; color: #166534; font-weight: 600; margin-bottom: 4px;&quot;&gt;🎯 核心目标&lt;/div&gt;
            &lt;div style=&quot;font-size: 13px; color: #15803D;&quot;&gt;快速读懂外文文献，跟上导师节奏&lt;/div&gt;
          &lt;/div&gt;
          &lt;div style=&quot;background: #FEF2F2; padding: 12px; border-radius: 8px;&quot;&gt;
            &lt;div style=&quot;font-size: 13px; color: #991B1B; font-weight: 600; margin-bottom: 4px;&quot;&gt;😣 核心恐惧&lt;/div&gt;
            &lt;div style=&quot;font-size: 13px; color: #DC2626;&quot;&gt;读不懂文献，组会汇报被批评&lt;/div&gt;

  &lt;!-- Section 2: 用户痛点 --&gt;
  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;
      &lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;
      核心痛点挖掘
    &lt;/div&gt;

    &lt;ul class=&quot;pain-list&quot;&gt;
      &lt;li class=&quot;pain-item&quot;&gt;
        &lt;h4&gt;痛点一：阅读效率极低，专业术语是最大障碍 &lt;span class=&quot;severity sev-high&quot;&gt;高频 · 严重&lt;/span&gt;&lt;/h4&gt;
        &lt;p&gt;
          每读一段就要查好几个单词，专业术语（如 biological pathway、immunofluorescence 等）普通翻译软件翻不准，
          查完还记不住，下一次遇到又要重查。一篇论文读下来，时间大多花在&quot;查词&quot;而非&quot;理解&quot;上。
        &lt;/p&gt;
      &lt;/li&gt;
      &lt;li class=&quot;pain-item&quot;&gt;
        &lt;h4&gt;痛点二：不知道从哪里开始读，抓不住重点 &lt;span class=&quot;severity sev-high&quot;&gt;高频 · 严重&lt;/span&gt;&lt;/h4&gt;
        &lt;p&gt;
          面对一篇新论文，不知道先读哪部分。Abstract 读完还是云里雾里，
          Method 部分又太细，囫囵吞枣读完了也不知道这篇论文到底解决了什么问题、创新点在哪里。
        &lt;/p&gt;
      &lt;/li&gt;
      &lt;li class=&quot;pain-item&quot;&gt;
        &lt;h4&gt;痛点三：工具太多太散，切换成本高 &lt;span class=&quot;severity sev-high&quot;&gt;高频 · 中等&lt;/span&gt;&lt;/h4&gt;
        &lt;p&gt;
          用 Zotero 管理文献、用知云翻译、用 ChatPDF 总结、用 MarginNote 做笔记……
          一篇文献要在 4-5 个软件之间来回切换，笔记和标注散落在各处，写综述时根本找不到。
        &lt;/p&gt;
      &lt;/li&gt;
      &lt;li class=&quot;pain-item&quot;&gt;
        &lt;h4&gt;痛点四：笔记不会做，读完就忘 &lt;span class=&quot;severity sev-mid&quot;&gt;中频 · 严重&lt;/span&gt;&lt;/h4&gt;
        &lt;p&gt;
          不知道该在文献里标注什么、笔记怎么整理。高亮了一堆黄色，回头看全忘了为什么标。
          想做个文献综述，十几篇论文的观点根本串不起来。
        &lt;/p&gt;
      &lt;/li&gt;
      &lt;li class=&quot;pain-item&quot;&gt;
        &lt;h4&gt;痛点五：预算有限，付费工具太贵 &lt;span class=&quot;severity sev-mid&quot;&gt;中频 · 中等&lt;/span&gt;&lt;/h4&gt;
        &lt;p&gt;
          研究生每月补贴有限，ChatPDF Plus $19.99/月、SciSpace $20/月、小绿鲸会员……
          这些工具加起来每月一两百，长期用吃不消。免费版又有各种限制（页数、次数、功能阉割）。
        &lt;/p&gt;
      &lt;/li&gt;
      &lt;li class=&quot;pain-item&quot;&gt;
        &lt;h4&gt;痛点六：文献管理混乱，越存越多越找不到 &lt;span class=&quot;severity sev-low&quot;&gt;低频 · 严重&lt;/span&gt;&lt;/h4&gt;
        &lt;p&gt;
          文献下载下来文件名都是乱的，存了几十上百篇之后，想找某篇论文全靠&quot;我记得它标题里有个什么词&quot;。
          标签分类体系不会建，越堆越乱。
        &lt;/p&gt;
      &lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;!-- Section 3: 典型场景 --&gt;
  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;
      &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;

    &lt;div class=&quot;card&quot;&gt;
      &lt;div style=&quot;display: flex; align-items: center; gap: 12px; margin-bottom: 20px;&quot;&gt;
        &lt;span style=&quot;font-size: 28px;&quot;&gt;🎬&lt;/span&gt;
        &lt;h3 style=&quot;font-size: 18px;&quot;&gt;场景：组会汇报前一周的小林&lt;/h3&gt;
      &lt;/div&gt;

      &lt;div class=&quot;scenario-timeline&quot;&gt;
        &lt;div class=&quot;scenario-step&quot;&gt;
          &lt;h4&gt;周一：接到任务，一脸懵&lt;/h4&gt;
          &lt;p&gt;导师在群里发了 15 篇英文文献，要求下周一组会汇报领域最新进展。小林下载下来，看标题都头大。&lt;/p&gt;
          &lt;span class=&quot;pain-tag&quot;&gt;痛点：不知道从哪篇开始读、怎么读&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;scenario-step&quot;&gt;
          &lt;h4&gt;周二：硬啃第一篇，效率极低&lt;/h4&gt;
          &lt;p&gt;打开 PDF，一边读一边用有道词典划词翻译，专业术语翻得不准，一句话要反复读 3 遍才懂大概意思。一上午只读了 2 页。&lt;/p&gt;
          &lt;span class=&quot;pain-tag&quot;&gt;痛点：专业术语翻译不准、阅读效率低&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;scenario-step&quot;&gt;
          &lt;h4&gt;周三：尝试各种工具，越用越乱&lt;/h4&gt;
          &lt;p&gt;听同学推荐用了小绿鲸翻译、ChatPDF 总结、Zotero 管理……每篇文献要在 3 个软件之间切换，笔记各存各的，写总结时要来回翻。&lt;/p&gt;
          &lt;span class=&quot;pain-tag&quot;&gt;痛点：工具切换成本高、笔记分散&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;scenario-step&quot;&gt;
          &lt;h4&gt;周五：读了 8 篇，但串不起来&lt;/h4&gt;
          &lt;p&gt;每篇好像都读懂了，但让她总结&quot;这个领域目前的研究方向有哪些、有哪些争议&quot;，她说不出来。笔记都是零散的高亮，没有结构化。&lt;/p&gt;
          &lt;span class=&quot;pain-tag&quot;&gt;痛点：笔记不会做、缺乏结构化梳理&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;scenario-step&quot;&gt;
          &lt;h4&gt;周日：熬夜赶 PPT，焦虑爆表&lt;/h4&gt;
          &lt;p&gt;组会 PPT 还没做，翻文献找数据找不到，引用格式也不对。最后东拼西凑交了差，心里知道质量不高。&lt;/p&gt;
          &lt;span class=&quot;pain-tag&quot;&gt;痛点：文献检索困难、写作引用辅助缺失&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- Section 5: 竞品优劣势总结 --&gt;
  &lt;div class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;
      &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;
      竞品优劣势深度总结
    &lt;/div&gt;

    &lt;div class=&quot;card-grid&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-icon&quot; style=&quot;background: #EEF2FF;&quot;&gt;🟦&lt;/div&gt;
        &lt;h3&gt;Zotero + 插件生态&lt;/h3&gt;
        &lt;p&gt;&lt;strong&gt;优势：&lt;/strong&gt;文献管理和引用是行业标杆，插件生态丰富，免费开源。&lt;/p&gt;
        &lt;p style=&quot;margin-top: 8px;&quot;&gt;&lt;strong&gt;劣势：&lt;/strong&gt;翻译和 AI 能力依赖第三方插件，配置门槛高；移动端体验差；存储收费。&lt;/p&gt;
        &lt;p style=&quot;margin-top: 8px; color: var(--danger); font-weight: 500;&quot;&gt;「新手痛点」：装插件、配 API Key 对小白不友好，学习曲线陡。&lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-icon&quot; style=&quot;background: #FEF3C7;&quot;&gt;🟨&lt;/div&gt;
        &lt;h3&gt;小绿鲸 / Scholared&lt;/h3&gt;
        &lt;p&gt;&lt;strong&gt;优势：&lt;/strong&gt;翻译体验好，学科术语准确，上手快，阅读功能完整。&lt;/p&gt;
        &lt;p style=&quot;margin-top: 8px;&quot;&gt;&lt;strong&gt;劣势：&lt;/strong&gt;文献管理能力弱，写作引用几乎没有；高级功能需付费。&lt;/p&gt;
        &lt;p style=&quot;margin-top: 8px; color: var(--danger); font-weight: 500;&quot;&gt;「新手痛点」：翻译完了就完了，笔记和知识沉淀不足，写综述时帮不上忙。&lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-icon&quot; style=&quot;background: #D1FAE5;&quot;&gt;🟩&lt;/div&gt;
        &lt;h3&gt;知云文献翻译&lt;/h3&gt;
        &lt;p&gt;&lt;strong&gt;优势：&lt;/strong&gt;完全免费，多引擎切换，安装即用，零学习成本。&lt;/p&gt;
        &lt;p style=&quot;margin-top: 8px;&quot;&gt;&lt;strong&gt;劣势：&lt;/strong&gt;只有翻译功能，没有文献管理、AI 总结、笔记系统。&lt;/p&gt;
        &lt;p style=&quot;margin-top: 8px; color: var(--danger); font-weight: 500;&quot;&gt;「新手痛点」：功能太单一，只能解决&quot;读&quot;的问题，不能解决&quot;懂&quot;和&quot;用&quot;的问题。&lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-icon&quot; style=&quot;background: #FCE7F3;&quot;&gt;🟪&lt;/div&gt;
        &lt;h3&gt;SciSpace / ChatPDF&lt;/h3&gt;
        &lt;p&gt;&lt;strong&gt;优势：&lt;/strong&gt;AI 问答和总结能力强，跨论文分析效率高，写作辅助好。&lt;/p&gt;
        &lt;p style=&quot;margin-top: 8px;&quot;&gt;&lt;strong&gt;劣势：&lt;/strong&gt;贵！免费额度极少；翻译能力弱；中文支持一般。&lt;/p&gt;
        &lt;p style=&quot;margin-top: 8px; color: var(--danger); font-weight: 500;&quot;&gt;「新手痛点」：价格劝退学生党，且没有系统化的中文文献阅读流。&lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-icon&quot; style=&quot;background: #E0E7FF;&quot;&gt;🟣&lt;/div&gt;
        &lt;h3&gt;MarginNote&lt;/h3&gt;
        &lt;p&gt;&lt;strong&gt;优势：&lt;/strong&gt;卡片 + 脑图 + 闪卡的深度阅读体验独一档，知识内化效果好。&lt;/p&gt;
        &lt;p style=&quot;margin-top: 8px;&quot;&gt;&lt;strong&gt;劣势：&lt;/strong&gt;学习曲线极陡，翻译弱，文献管理弱，更适合教材而非论文。&lt;/p&gt;
        &lt;p style=&quot;margin-top: 8px; color: var(--danger); font-weight: 500;&quot;&gt;「新手痛点」：功能太复杂，入门门槛高，急着读文献的学生没时间学。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  /* Reading view wireframe */
  .wf-reader {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    height: calc(100% - 40px);
  }
  .wf-reader-panel {
    background: #FAFAFA;
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 16px;
    position: relative;
  }
  .wf-reader-panel .panel-label {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-bottom: 10px;
    font-weight: 500;
  }
  .wf-text-line {
    height: 8px;
    background: #E5E7EB;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .wf-text-line.short { width: 60%; }
  .wf-text-line.med { width: 85%; }
  .wf-text-line.long { width: 100%; }

  .wf-ai-sidebar {
    position: absolute;
    right: 24px;
    top: 24px;
    bottom: 24px;
    width: 260px;
    background: white;
    border-radius: 10px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    padding: 16px;
  }
  .wf-ai-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .wf-ai-card {
    background: var(--primary-bg);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .wf-ai-card .ai-card-label {
    font-size: 11px;
    color: var(--primary-dark);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .wf-ai-card .ai-card-line {
    height: 6px;
    background: rgba(79,70,229,0.2);
    border-radius: 3px;
    margin-bottom: 4px;
  }

  /* User flow */
  .flow-steps {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: wrap;
    justify-content: center;
  }
  .flow-step {
    background: var(--card);
    border: 2px solid var(--primary-light);
    border-radius: 12px;
    padding: 16px 20px;
    text-align: center;
    min-width: 140px;
    box-shadow: var(--shadow-sm);
  }
  .flow-step-icon {
    font-size: 24px;
    margin-bottom: 6px;
  }
  .flow-step-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .flow-step-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .flow-arrow {
    font-size: 20px;
    color: var(--primary-light);
    padding: 0 8px;
    flex-shrink: 0;
  }

  /* Metric cards */
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .metric-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-sm);
  }
  .metric-card .metric-name {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .metric-card .metric-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 4px;
  }
  .metric-card .metric-desc {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  /* Roadmap */
  .roadmap {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .roadmap-phase {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  .roadmap-phase.current {
    border: 2px solid var(--primary);
  }
  .phase-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .phase-1 { background: #D1FAE5; color: #059669; }
  .phase-2 { background: #FEF3C7; color: #D97706; }
  .phase-3 { background: #EDE9FE; color: #7C3AED; }
  .roadmap-phase h4 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .roadmap-phase ul {
    list-style: none;
  }
  .roadmap-phase li {
    font-size: 14px;
    color: var(--text-secondary);
    padding: 4px 0 4px 20px;
    position: relative;
  }
  .roadmap-phase li::before {
    content: &#x27;✓&#x27;;
    position: absolute;
    left: 0;
    color: var(--success);
    font-weight: 700;
  }

  /* Note box */
  .note-box {
    background: var(--primary-bg);
    border-left: 4px solid var(--primary);
    border-radius: 0 10px 10px 0;
    padding: 16px 20px;
    margin: 16px 0;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .note-box strong {
    color: var(--primary-dark);
  }

  /* Two column layout */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 32px 0;
    color: var(--text-secondary);
    font-size: 13px;
    border-top: 1px solid var(--border);
    margin-top: 56px;
  }

  @media (max-width: 900px) {
    .overview-grid { grid-template-columns: repeat(2, 1fr); }
    .roadmap { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; }
    .cover { padding: 48px 32px; }
    .cover h1 { font-size: 32px; }
  }
&lt;/style&gt;
&lt;/head&gt;

  &lt;!-- ========== 1. 产品概述 ========== --&gt;
  &lt;div class=&quot;section&quot; id=&quot;overview&quot;&gt;

    &lt;div class=&quot;card&quot; style=&quot;margin-bottom: 24px;&quot;&gt;
      &lt;h3 style=&quot;margin-bottom: 12px;&quot;&gt;🎯 产品定位&lt;/h3&gt;
      &lt;p style=&quot;font-size: 15px; color: var(--text-secondary);&quot;&gt;

        以「智能翻译」为基础，以「AI 速读」为亮点，以「结构化笔记」为核心价值，
        帮助用户从&quot;读不懂外文文献&quot;快速过渡到&quot;读得懂、记得住、用得上&quot;，降低科研入门门槛。

  &lt;!-- ========== 3. 功能详细需求（PRD） ========== --&gt;
  &lt;div class=&quot;section&quot; id=&quot;prd&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;
      &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;
      功能详细需求（PRD）
    &lt;/div&gt;

    &lt;!-- Module 1: 智能翻译 --&gt;
    &lt;div class=&quot;sub-title&quot;&gt;模块一：智能翻译&lt;/div&gt;
    &lt;div class=&quot;prd-table-wrap&quot; style=&quot;margin-bottom: 28px;&quot;&gt;
      &lt;table class=&quot;prd-table&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th&gt;功能点&lt;/th&gt;
            &lt;th&gt;功能描述&lt;/th&gt;
            &lt;th&gt;用户价值&lt;/th&gt;
            &lt;th&gt;优先级&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td&gt;划词翻译&lt;/td&gt;
            &lt;td&gt;PDF 阅读器中选中任意英文单词/句子，悬浮窗即时显示中文翻译，支持发音、收藏到生词本&lt;/td&gt;
            &lt;td&gt;遇到生词不用切出去查词典，阅读不被打断&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;priority p0&quot;&gt;P0 - 必须&lt;/span&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;段落对照翻译&lt;/td&gt;
            &lt;td&gt;左侧原文、右侧译文的双栏对照阅读模式，可按段落或按页翻译，保持排版对齐&lt;/td&gt;
            &lt;td&gt;整段理解更连贯，适合精读论文正文&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;priority p0&quot;&gt;P0 - 必须&lt;/span&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;学科术语库&lt;/td&gt;
            &lt;td&gt;内置生物医学、计算机、材料、经济学等学科术语库，翻译时自动匹配专业译法&lt;/td&gt;
            &lt;td&gt;解决普通翻译软件&quot;专业术语翻不准&quot;的核心痛点&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;priority p0&quot;&gt;P0 - 必须&lt;/span&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;多引擎切换&lt;/td&gt;
            &lt;td&gt;支持百度、谷歌、DeepL 等多个翻译引擎，用户可一键切换对比翻译质量&lt;/td&gt;
            &lt;td&gt;不同学科适合不同引擎，给用户选择权&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;priority p1&quot;&gt;P1 - 重要&lt;/span&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;生词本&lt;/td&gt;
            &lt;td&gt;自动收集查阅过的专业词汇，支持按文献分组、按学科筛选，可导出复习&lt;/td&gt;
            &lt;td&gt;边读边积累专业词汇，长期提升阅读能力&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;priority p1&quot;&gt;P1 - 重要&lt;/span&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;全文翻译&lt;/td&gt;
            &lt;td&gt;一键翻译整篇论文，生成可导出的中英对照文档&lt;/td&gt;
            &lt;td&gt;适合快速通读或翻译后做笔记&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;priority p2&quot;&gt;P2 - 一般&lt;/span&gt;&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;

    &lt;!-- Module 2: AI 速读 --&gt;
    &lt;div class=&quot;sub-title&quot;&gt;模块二：AI 速读&lt;/div&gt;
    &lt;div class=&quot;prd-table-wrap&quot; style=&quot;margin-bottom: 28px;&quot;&gt;
      &lt;table class=&quot;prd-table&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th&gt;功能点&lt;/th&gt;
            &lt;th&gt;功能描述&lt;/th&gt;
            &lt;th&gt;用户价值&lt;/th&gt;
            &lt;th&gt;优先级&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td&gt;一键核心提炼&lt;/td&gt;
            &lt;td&gt;上传论文后，AI 自动提取「研究背景、核心问题、研究方法、主要结论、创新点」5 个关键信息&lt;/td&gt;
            &lt;td&gt;5 分钟 get 一篇论文的核心，解决&quot;抓不住重点&quot;的痛点&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;priority p0&quot;&gt;P0 - 必须&lt;/span&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;AI 文献问答&lt;/td&gt;
            &lt;td&gt;用户用中文提问，AI 基于论文内容作答，并标注答案来源的页码和段落&lt;/td&gt;
            &lt;td&gt;带着问题读论文，效率更高；适合组会前快速找信息&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;priority p0&quot;&gt;P0 - 必须&lt;/span&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;

<script>
function fit(id){
  var f=document.getElementById(id);
  try{ f.style.height=(f.contentDocument.body.scrollHeight+40)+'px'; }catch(e){}
}
['f1','f2'].forEach(function(id){
  var f=document.getElementById(id);
  f.addEventListener('load',function(){ fit(id); setTimeout(function(){fit(id);},600); setTimeout(function(){fit(id);},1800); });
});
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    document.getElementById('w1').classList.toggle('hidden', b.dataset.t!=='f1');
    document.getElementById('w2').classList.toggle('hidden', b.dataset.t!=='f2');
    window.scrollTo({top:0,behavior:'smooth'});
  });
});
